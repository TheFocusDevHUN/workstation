---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: workstation-os
# description will be included in the image's metadata
description: My custom workstation OS setup based on Universal Blue with Hyprland
# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: 44

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into your image's root folder /

  - type: dnf
    repos:
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      nonfree: rpmfusion
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://packages.microsoft.com/yumrepos/vscode/config.repo
        - https://repository.mullvad.net/rpm/stable/mullvad.repo
      copr:
        - atim/starship
        - sdegler/hyprland
        - errornointernet/quickshell
        - quadratech188/vicinae
        - zeno/scrcpy
        - erikreider/SwayNotificationCenter
        - g3tchoo/prismlauncher
    remove:
      packages:
        - firefox
    install:
      skip-unavailable: false
      install-weak-deps: false
      packages:
        # Core utilities
        - git
        - git-lfs
        - glibc
        - "gcc-c++"
        - jemalloc
        - curl
        - xxd
        - htop
        - nano
        - docker-cli
        - moby-engine
        - neovim
        - code
        - https://storage.googleapis.com/minikube/releases/latest/minikube-latest.x86_64.rpm
        - https://codeberg.org/GramEditor/gram/releases/download/1.2.1/gram_1.2.1-1_x86_64.rpm
        - zed
        - android-tools

        # Shell
        - zsh
        - starship

        # Media
        - vlc
        - mpv

        # Hyprland and Wayland tools
        - hyprland
        - quickshell
        - xdg-desktop-portal
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk
        - adb
        - gtk-layer-shell
        - gtk3-devel
        - gparted
        - vicinae
        - gamescope
        - hyprland-guiutils
        - uwsm
        - sddm
        - waybar
        - gtk4-layer-shell
        - swww
        - grim
        - slurp
        - swappy
        - swaync
        #- wezterm
        - kitty
        # System utilities
        - gnome-keyring
        - quickemu
        - virt-manager
        - mullvad-vpn
        - system-config-printer
        - gnome-keyring-pam
        - mate-polkit
        - kvantum
        - gtk-murrine-engine
        - libadwaita
        - libadwaita-devel
        - qt5ct
        - qt6ct
        - engrampa
        - atril
        - eom
        - pluma
        - mate-calc
        - pipewire
        - wireplumber
        - telnet
        - netcat
        - helm
        - pipewire-pulseaudio
        - pavucontrol
        - network-manager-applet
        - distrobox
        - nwg-look
        - xfce4-power-manager
        - nemo
        - simple-scan
        - blueman
        # Themes and fonts
        - papirus-icon-theme
        #- gnome-themes-extra
        - kf6-kirigami
        - plasma5support
        - mate-system-monitor
        - sassc
        - jetbrains-mono-fonts-all
        - google-noto-emoji-fonts
        - adwaita-fonts-all

        # Applications
        - prismlauncher

  - type: script
    scripts:
      - install-gtk-theme.sh
      #- install-icon-theme.sh
      - install-kv-sddm-theme.sh

  - type: fonts
    fonts:
      google-fonts:
        - Roboto
        - Inter
        - NotoEmoji
      nerd-fonts:
        - JetBrainsMono

  - type: systemd
    system:
      enabled:
        #- podman.socket
        - sddm.service

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.discordapp.Discord
          - com.bitwarden.desktop
          - md.obsidian.Obsidian
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton-GE
          - org.chromium.Chromium
          - com.brave.Browser

  - type: signing
  - type: chezmoi
    repository: "https://github.com/TheFocusDevHUN/dotfiles"
    all-users: true
    file-conflict-policy: skip
